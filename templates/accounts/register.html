{% extends "base.html" %}
{% block title %}Create an account | Rescue Bite{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl px-4 py-16 sm:px-6">
    <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
        <p class="text-sm font-semibold text-emerald-700">Start rescuing</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-950">Create your Rescue Bite account</h1>
        <form method="post" class="mt-8 space-y-5">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-semibold text-white hover:bg-emerald-700" type="submit">Create account</button>
        </form>
    </div>
</section>
{% endblock %}
