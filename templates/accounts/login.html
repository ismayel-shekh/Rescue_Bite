{% extends "base.html" %}
{% block title %}Log in | Rescue Bite{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-4 py-16 sm:px-6">
    <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
        <p class="text-sm font-semibold text-emerald-700">Welcome back</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-950">Log in to Rescue Bite</h1>
        <form method="post" class="mt-8 space-y-5">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-semibold text-white hover:bg-emerald-700" type="submit">Log in</button>
        </form>
        <p class="mt-6 text-sm text-slate-600">New here? <a class="font-semibold text-emerald-700" href="{% url 'accounts:register' %}">Create an account</a></p>
    </div>
</section>
{% endblock %}
